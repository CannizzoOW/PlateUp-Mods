<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:dark;--bg:#0d1016;--card:#181d27;--input:#212834;--accent:#705cff;--muted:#a4adbe;--line:#303849;--green:#63d7a1}*{box-sizing:border-box}html{height:100%;overflow-y:auto;scrollbar-color:#465169 #121720;scrollbar-width:thin}body{margin:0;background:radial-gradient(circle at 75% 0,#251f48 0,transparent 34%),var(--bg);color:#f7f8fc;font:15px "Segoe UI",sans-serif;min-height:100%;padding:28px;overflow-x:hidden}.app{max-width:900px;margin:auto;padding-bottom:8px}.head{display:flex;align-items:baseline;gap:12px}.head h1{font-size:34px;margin:0}.version{color:#8f7dff;font-weight:700}.sub{color:var(--muted);margin:5px 0 18px}.notice{background:#1b222f;border:1px solid #343e53;border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 15px 45px #0005}.notice strong{display:block;font-size:17px}.notice span{color:var(--muted)}.section{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:20px 0 7px}.path,.mods,.activity{background:var(--card);border:1px solid var(--line);border-radius:10px}.path{display:flex;padding:7px}.path input{flex:1;min-width:0;background:var(--input);border:0;outline:0;border-radius:7px;color:#e7ebf3;padding:11px}.btn{border:0;border-radius:7px;padding:10px 15px;margin-left:7px;background:#303a4b;color:white;font-weight:650;cursor:pointer;white-space:nowrap}.btn:hover{filter:brightness(1.18);transform:translateY(-1px)}.btn:disabled{opacity:.45;cursor:default;transform:none}.primary{background:var(--accent)}.danger{background:#693743}.mods{max-height:272px;overflow-y:auto;scrollbar-color:#465169 var(--card);scrollbar-width:thin}.mod{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:68px;padding:14px 16px;border-bottom:1px solid var(--line)}.mod:last-child{border:0}.mod:hover{background:#1e2531}.mod input{accent-color:var(--accent);width:18px;height:18px}.name{font-weight:650}.meta{color:var(--muted);font-size:13px;margin-top:2px}.state{font-size:12px;font-weight:750;color:var(--green);letter-spacing:.04em;text-align:right}.new{color:#a99cff}.actions{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 0}.actions .btn{margin-left:0}.activity{height:115px;min-height:80px;padding:13px;color:#b8c1d1;font:13px Consolas,monospace;line-height:1.7;overflow:auto;scrollbar-color:#465169 var(--card);scrollbar-width:thin;white-space:pre-wrap}.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:8px;box-shadow:0 0 0 0 #63d7a177;animation:p 2s infinite}@keyframes p{70%{box-shadow:0 0 0 7px #63d7a100}}::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#121720;border-radius:8px}::-webkit-scrollbar-thumb{background:#465169;border:2px solid #121720;border-radius:8px}::-webkit-scrollbar-thumb:hover{background:#5b6885}@media(max-width:700px){body{padding:18px}.head h1{font-size:28px}.notice{align-items:flex-start;gap:10px}.path{flex-wrap:wrap}.path input{flex-basis:100%;margin-bottom:7px}.path .btn{flex:1;margin-left:0;margin-right:7px}.mod{grid-template-columns:28px minmax(0,1fr)}.state{grid-column:2;text-align:left}.mods{max-height:272px}}
</style></head><body><main class="app"><div class="head"><h1>Cannizzo ModPatcher</h1><span class="version">v{{VERSION}}</span></div><p class="sub">Install and update verified PlateUp mods from GitHub</p><div class="notice"><div><strong><i class="pulse"></i>{{NOTICE_TITLE}}</strong><span>{{NOTICE_TEXT}}</span></div>{{LAUNCHER_BUTTON}}</div><div class="section">PLATEUP INSTALLATION</div><div class="path"><input value="{{PATH}}" readonly><button class="btn" onclick="send('find')">Find PlateUp</button><button class="btn" onclick="send('browse')">Choose folder</button></div><div class="section">MODS</div><div class="mods">{{MODS}}</div><div class="actions"><button class="btn primary" onclick="send('install')">Install selected</button><button class="btn danger" onclick="send('remove')">Remove selected</button><button class="btn" onclick="send('refresh')">Check now</button></div><div class="section">ACTIVITY</div><div class="activity" id="activity">{{LOG}}</div></main><script>function scrollActivityToLatest(){const activity=document.getElementById('activity');if(activity)activity.scrollTop=activity.scrollHeight}function send(action){const ids=[...document.querySelectorAll('.mod input:checked')].map(x=>x.value);chrome.webview.postMessage({action,ids})}addEventListener('DOMContentLoaded',scrollActivityToLatest);</script></body></html>
